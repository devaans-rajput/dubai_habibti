<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Registration Form</title>
 
    <!-- Author: Devaans Singh -->
    <style>
        body {
            font-family: Verdana, sans-serif;
            background-color: #f5f4f0;
            margin: 0;
            padding: 30px;
        }
 
        .form-wrapper {
            width: 60%;
            margin: auto;
            background-color: #fbfaf7;
            padding: 25px;
            border: 1px solid #bbb;
        }
 
        h1 {
            text-align: center;
            color: #800020;
        }
 
        .intro {
            text-align: center;
            margin-bottom: 25px;
        }
 
        fieldset {
            border: 1px solid #888;
            margin-bottom: 20px;
            padding: 15px;
        }
 
        legend {
            color: #800020;
            font-weight: bold;
        }
 
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }
 
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #888;
            box-sizing: border-box;
        }
 
        .choice-group label,
        .declaration label {
            display: inline;
            margin: 0 12px 0 4px;
            font-weight: normal;
        }
 
        .actions {
            text-align: center;
            margin-top: 25px;
        }
 
        button {
            padding: 10px 25px;
            border: none;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
 
        button[type="submit"] {
            background-color: #800020;
        }
 
        button[type="submit"]:hover {
            background-color: #5c0017;
        }
 
        button[type="reset"] {
            background-color: #777;
        }
 
        button[type="reset"]:hover {
            background-color: #444;
        }
 
        @media (max-width: 768px) {
            .form-wrapper {
                width: 90%;
            }
        }
    </style>
</head>
 
<body>
 
    <div class="form-wrapper">
 
        <h1>College Admission Registration Form</h1>
        <p class="intro">Fill in the details below to register for admission.</p>
 
        <form action="#" method="post">
 
            <fieldset>
                <legend>Personal Information</legend>
 
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="e.g. Devaans Singh" required>
 
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="name@example.com" required>
 
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="10-digit mobile number"
                       minlength="10" maxlength="10" required>
 
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
 
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password"
                       placeholder="At least 6 characters"
                       minlength="6" required>
 
                <label>Gender</label>
                <div class="choice-group">
                    <input type="radio" id="gender-male" name="gender" value="Male" required>
                    <label for="gender-male">Male</label>
 
                    <input type="radio" id="gender-female" name="gender" value="Female">
                    <label for="gender-female">Female</label>
 
                    <input type="radio" id="gender-other" name="gender" value="Other">
                    <label for="gender-other">Other</label>
                </div>
 
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="4"
                          placeholder="House no., street, city, state, PIN"
                          required></textarea>
            </fieldset>
 
            <fieldset>
                <legend>Academic Details</legend>
 
                <label for="course">Course Applying For</label>
                <select id="course" name="course" required>
                    <option value="">-- Select a course --</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="B.Tech AI/ML">B.Tech AI/ML</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>
                </select>
            </fieldset>
 
            <fieldset>
                <legend>Course Preferences</legend>
 
                <label>Your Interests</label>
                <div class="choice-group">
                    <input type="checkbox" id="int-coding" name="interests" value="Coding">
                    <label for="int-coding">Coding</label>
 
                    <input type="checkbox" id="int-sports" name="interests" value="Sports">
                    <label for="int-sports">Sports</label>
 
                    <input type="checkbox" id="int-music" name="interests" value="Music">
                    <label for="int-music">Music</label>
 
                    <input type="checkbox" id="int-reading" name="interests" value="Reading">
                    <label for="int-reading">Reading</label>
                </div>
            </fieldset>
 
            <fieldset>
                <legend>Documents</legend>
 
                <label for="photo">Upload Photograph</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
 
                <label for="documents">Upload Supporting Documents</label>
                <input type="file" id="documents" name="documents"
                       accept=".pdf,.jpg,.jpeg,.png" required>
            </fieldset>
 
            <div class="declaration">
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">
                    I declare that all the information provided above is true and correct.
                </label>
            </div>
 
            <div class="actions">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
 
        </form>
 
    </div>
 
</body>
</html>
